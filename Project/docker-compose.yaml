version: '3.8'

services:
  db:
    image: postgres:15 
    container_name: trading_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data 
    ports:
      - "5432:5432" 
    networks:
      - tradingnet
    restart: unless-stopped

  bot:
    container_name: trading_bot
    build:
      context: ./bot
      dockerfile: Dockerfile
    env_file:
      - .env 
    depends_on:
      - db 
    volumes:
      - ./bot:/app 

    networks:
      - tradingnet
    restart: unless-stopped
    command: ["python", "main_bot.py"] 

volumes:
  pgdata: 

networks:
  tradingnet:
    driver: bridge
